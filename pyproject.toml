[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth_simple"
version = "0.1.0"
description = "Simple OAuth2 demo app"
authors = [ { name = "Unknown" } ]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flask", "requests"]

[tool.flask]
app = "oauth_app:app"

[tool.vercel]
entrypoint = "oauth_app:app"
